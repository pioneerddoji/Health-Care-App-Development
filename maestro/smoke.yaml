# 케어노트 E2E 스모크 — Maestro (https://maestro.mobile.dev)
# 실행: maestro test maestro/smoke.yaml  (에뮬레이터/실기기에서 데모 모드 기준)
# 커버: 가입 → 동의 → 홈 → 기록 추가 → 대시보드 → 레포트 → 설정
appId: app.carenote.mvp
---
- launchApp
- assertVisible: "케어노트 🧸"

# 회원가입 → 동의
- tapOn: "회원가입"
- assertVisible: "보호자 회원가입"
- tapOn:
    point: "50%,28%"   # 이메일 입력
- inputText: "smoke@example.com"
- hideKeyboard
- tapOn:
    point: "50%,38%"   # 비밀번호
- inputText: "password123"
- hideKeyboard
- tapOn:
    point: "50%,48%"   # 이름
- inputText: "스모크"
- hideKeyboard
- tapOn: "다음: 이용 동의"
- assertVisible: "이용 동의"
- tapOn: "[필수] 서비스 이용약관 동의"
- tapOn: "[필수] 법정대리인 확인 및 동의"
- tapOn: "[필수] 건강정보(민감정보) 수집·이용 별도 동의"
- tapOn: "동의하고 시작하기"

# 홈
- assertVisible: "안녕하세요"
- assertVisible: "김하은"

# 기록 추가 (증상)
- tapOn: "기록"
- assertVisible: "의 기록"
- tapOn: "+ 기록 추가"
- assertVisible: "기록 유형"
- tapOn: "🤒 증상"
- tapOn: "발열, 기침, 콧물, 발진…"
- inputText: "스모크 증상"
- hideKeyboard
- scrollUntilVisible:
    element: "기록 저장"
- tapOn: "기록 저장"
- assertVisible: "스모크 증상"

# 대시보드 그래프
- tapOn: "대시보드"
- assertVisible: "체온"
- assertVisible: "수면 시간"

# 레포트
- tapOn: "레포트"
- assertVisible: "병원 제출용 레포트"
- assertVisible: "만료형 공유 링크"

# 설정 (공동관리/동의/삭제)
- tapOn: "홈"
- tapOn: "⚙️"
- assertVisible: "보호자 공동 관리"
- assertVisible: "동의 내역"
- assertVisible: "데이터 관리"
