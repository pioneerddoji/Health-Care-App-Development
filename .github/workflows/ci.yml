name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  device-qa-evidence:
    name: device-qa-evidence (offline static gate)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record checked-out candidate SHA
        run: git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Validate offline device-QA evidence fixtures
        run: npm run test:device-qa-evidence
      - name: Verify device-QA evidence provenance CLI
        run: npm run check:device-qa-evidence-provenance

  rls-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS integration tests
        working-directory: supabase/tests
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -f rls_test.sql | tee rls_out.txt
          echo "PASS=$(grep -c PASS rls_out.txt || true) FAIL=$(grep -c FAIL rls_out.txt || true)"
          ! grep -q FAIL rls_out.txt
