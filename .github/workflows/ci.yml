name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e

  gating-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:gating

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test and type-check account deletion Edge Function
        run: |
          deno test supabase/functions/delete-account/contract_test.ts
          deno check supabase/functions/delete-account/index.ts

  rls-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgreSQL 16 RLS + account-deletion fixture
        working-directory: supabase/tests
        run: |
          echo "RLS_PG16_ACCOUNT_DELETION_FIXTURE=enabled"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -f rls_test.sql | tee rls_out.txt
          echo "PASS=$(grep -c PASS rls_out.txt || true) FAIL=$(grep -c FAIL rls_out.txt || true)"
          ! grep -q FAIL rls_out.txt
