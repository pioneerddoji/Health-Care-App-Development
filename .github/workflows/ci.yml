name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e

  gating-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:gating

  edge-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Execute share, billing, and account-deletion contracts
        run: |
          deno test --allow-env --allow-net \
            supabase/functions/share-report/index_test.ts \
            supabase/functions/billing-webhook/index_test.ts \
            supabase/functions/delete-account/contract_test.ts
          deno check supabase/functions/share-report/index.ts
          deno check supabase/functions/billing-webhook/index.ts
          deno check supabase/functions/delete-account/index.ts

  rls-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgreSQL 16 RLS + account-deletion fixture
        working-directory: supabase/tests
        run: |
          set -Eeuo pipefail
          expected_passes=163
          echo "RLS_PG16_ACCOUNT_DELETION_FIXTURE=enabled"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -f rls_test.sql 2>&1 | tee rls_out.txt

          pass_count=$(grep -c '^PASS' rls_out.txt || true)
          fail_count=$(grep -c '^FAIL' rls_out.txt || true)
          completion_count=$(grep -Fxc "RLS_SUITE_COMPLETE expected=${expected_passes}" rls_out.txt || true)
          echo "RLS_ASSERTIONS PASS=${pass_count}/${expected_passes} FAIL=${fail_count} COMPLETION=${completion_count}"

          test "${pass_count}" -eq "${expected_passes}"
          test "${fail_count}" -eq 0
          test "${completion_count}" -eq 1
